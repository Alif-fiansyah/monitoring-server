<div class="user-profile-card">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div class="avatar-circle">{initial}</div>
        <div style="overflow: hidden;">
            <div style="font-weight: 600; font-size: 14px; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                {username}
            </div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; margin-top: 2px;">
                <span class="user-badge-online"></span>
                <span>Active Operator</span>
            </div>
        </div>
    </div>
</div>
