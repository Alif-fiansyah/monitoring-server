<div style="margin-top: 4px;">
    <span style="font-weight: 600; font-size: 15px; color: #f1f5f9;">{name}</span>
    &nbsp; {status_badge} &nbsp; {ssl_badge}
    <div style="font-size: 12px; color: #64748b; font-family: monospace; margin-top: 4px;">{url}</div>
    <div style="margin-top: 6px;">
        <span class="meta-tag">Server: {server}</span>
        <span class="meta-tag">Size: {size_kb} KB</span>
        <span class="meta-tag">Type: {content_type}</span>
    </div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">
        Respon: <b>{latency} ms</b> &nbsp;•&nbsp; Dicek: {last_checked}
    </div>
</div>
