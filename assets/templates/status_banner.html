<div style="background: {bg_color}; border: 1px solid {border_color}; border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 16px;">
        <div style="width: 14px; height: 14px; border-radius: 50%; background-color: {dot_color}; box-shadow: 0 0 12px {dot_color};"></div>
        <div>
            <div style="font-size: 18px; font-weight: 700; color: #f8fafc; letter-spacing: 0.3px;">{headline}</div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 3px;">Terakhir diperbarui secara otomatis pada {updated_at}</div>
        </div>
    </div>
    <div style="text-align: right;">
        <span style="background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #e2e8f0; font-family: monospace;">
            Uptime SLA: {uptime_sla}%
        </span>
    </div>
</div>
