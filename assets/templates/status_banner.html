<div class="status-banner-card" style="background: {bg_color}; border: 1px solid {border_color};">
    <div class="status-banner-left">
        <div style="width: 12px; height: 12px; border-radius: 50%; background-color: {dot_color}; box-shadow: 0 0 10px {dot_color}; flex-shrink: 0;"></div>
        <div>
            <div style="font-size: 15px; font-weight: 700; color: #f8fafc; line-height: 1.3;">{headline}</div>
            <div style="font-size: 11.5px; color: #94a3b8; margin-top: 3px;">Diperbarui otomatis pada {updated_at}</div>
        </div>
    </div>
    <div class="status-banner-right">
        <span style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 600; color: #f1f5f9; font-family: monospace; white-space: nowrap;">
            Uptime SLA: {uptime_sla}%
        </span>
    </div>
</div>
